<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Участники | VALTEER</title>
    <link rel="stylesheet" href="style.css">
	
    <style>
        /* Сетка участников */
        .members-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }

        .member-avatar {
            width: 130px; height: 130px; border-radius: 50%;
            margin: 0 auto 15px; object-fit: cover; display: block;
            transition: 0.5s; position: relative;
        }

        .ava-v { border: 4px solid #ff4dff; box-shadow: 0 0 20px #ff4dff; animation: pulse-v 3s infinite; }
        .ava-m { border: 4px solid #00ff00; box-shadow: 0 0 15px #00ff00; }
        .ava-l { border: 4px solid #ffffff; box-shadow: 0 0 15px rgba(255,255,255,0.5); }

        @keyframes pulse-v {
            0%, 100% { box-shadow: 0 0 15px #ff4dff; }
            50% { box-shadow: 0 0 35px #ff4dff; }
        }

        .member-card { text-align: center; }
        .member-card:hover .member-avatar { transform: scale(1.1) rotate(3deg); }

        .role {
            font-weight: bold; text-transform: uppercase; font-size: 0.85em;
            margin-bottom: 10px; letter-spacing: 1px;
        }

        .member-link {
            text-decoration: none; color: inherit; display: block;
            transition: transform 0.3s;
        }
        .member-link:hover { transform: translateY(-8px); }
    </style>
</head>
<body>
    <nav class="main-nav"><a href="index.html" class="nav-link">Главная</a><a href="members.html" class="nav-link active">Участники</a><a href="blog.html" class="nav-link">Блог</a><a href="gallery.html" class="nav-link">Фан-арты</a></nav>
    <div class="moon"></div>

   <div class="container" style="max-width: 1100px;"> 
    <h1 class="title">Иерархия Культа</h1>
    
    <div class="card">
        <h2 style="color: #9147ff;">Орбита VALTEER</h2>
        <div class="members-grid">
            <a href="valteer.html" class="member-link">
                <div class="member-card">
                    <img src="valteer_ava.png" class="member-avatar ava-v" alt="Valteer">
                    <h3>Valteer</h3>
                    <p class="role" style="color: #ff4dff;">Основательница</p>
                    <p>Сердце и голос сообщества.</p>
                </div>
            </a>
          

                <a href="moderators.html" class="member-link">
                    <div class="member-card">
                        <img src="mod_ava.png" class="member-avatar ava-m" alt="Модераторы">
                        <h3>Модераторы</h3>
                        <p class="role" style="color: #00ff00;">Хранители чата</p>
                        <p>Карающий меч и щит спокойствия.</p>
                    </div>
                </a>

                <a href="community.html" class="member-link">
                    <div class="member-card">
                        <img src="legend_ava.png" class="member-avatar ava-l" alt="Легенды">
                        <h3>Члены сообщества</h3>
                        <p class="role" style="color: #ffffff;">Легенды чата</p>
                        <p>Те, чья преданность проверена временем.</p>
                    </div>
                </a>
            </div>
        </div>
    </div>

    <footer>VALTEER COMMUNITY • 2026</footer>
</body>
</html>
