<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="icon" type="image/png" href="/favicon.png">
    <meta charset="UTF-8">
    <title>Фан-арты | VALTEER</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .coming-soon-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 70vh;
            text-align: center;
        }
        .coming-soon-title {
            font-size: clamp(30px, 5vw, 50px);
            margin-bottom: 20px;
            color: #ff4dff;
            text-shadow: 0 0 20px rgba(255, 77, 255, 0.5);
        }
        .loader-dots {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        .dot {
            width: 12px;
            height: 12px;
            background: #9147ff;
            border-radius: 50%;
            animation: dot-pulse 1.5s infinite ease-in-out;
        }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes dot-pulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.5); opacity: 1; box-shadow: 0 0 15px #9147ff; }
        }
    </style>
</head>
<body>
    <div class="moon"></div>
    <div id="star-container"></div>

    <nav class="main-nav">
        <a href="index.html" class="nav-link">Главная</a>
        <a href="members.html" class="nav-link">Участники</a>
        <a href="blog.html" class="nav-link">Блог</a>
        <a href="gallery.html" class="nav-link active">Фан-арты</a>
    </nav>

    <div class="container">
        <div class="coming-soon-container">
            <h1 class="coming-soon-title">Раздел в разработке</h1>
            
            <div class="loader-dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>

            <div class="card" style="max-width: 500px;">
                <p style="font-size: 1.1em; line-height: 1.6; margin-bottom: 20px;">
                    Мы готовим нечто крутое! Скоро здесь появится галерея ваших потрясающих фан-артов с возможностью управления и модерации.
                </p>
                <a href="index.html" class="button">← Вернуться на главную</a>
            </div>
        </div>
    </div>

    <footer>VALTEER COMMUNITY • 2026</footer>

    <script>
        // Добавляем падающие звезды для атмосферы
        function createStar() {
            const star = document.createElement('div');
            star.className = 'star-fall';
            star.style.left = Math.random() * 100 + 'vw';
            document.body.appendChild(star);
            setTimeout(() => star.remove(), 4000);
        }
        setInterval(createStar, 800);
    </script>
</body>
</html>
